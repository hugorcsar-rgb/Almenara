  <!-- Divider -->
  <line x1="120" y1="540" x2="1080" y2="540" stroke="#F4F0E8" stroke-opacity="0.14" stroke-width="1"/>

  <!-- Footer info -->
  <text x="120" y="578"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-weight="500"
        font-size="14"
        letter-spacing="4"
        fill="#8A93A1">PATENTED LED TECHNOLOGY · MADRID</text>

  <text x="1080" y="578"
        text-anchor="end"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-weight="500"
        font-size="14"
        letter-spacing="4"
        fill="#8A93A1">275+ lm/W</text>
</svg>
