<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Almenara — The new standard in LED efficiency">
  <rect width="1200" height="630" fill="#0E1A2A"/>

  <!-- Brand mark -->
  <g transform="translate(120, 140)">
    <circle cx="60" cy="14" r="7" fill="#F5E8C8"/>
    <path d="M60 36 L20 132 M60 36 L100 132 M36 102 L84 102"
          stroke="#F4F0E8"
          stroke-width="7"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="120" y="430"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-weight="200"
        font-size="120"
        letter-spacing="10"
        fill="#F4F0E8">ALMENARA</text>

  <!-- Tagline -->
  <text x="120" y="478"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-weight="400"
        font-size="26"
        letter-spacing="2"
