name: Diagnóstico 403

# Temporal: averigua qué filtra Hostinger (agente, IP o todo). Se borra después.
on:
  push:
    branches: [claude/charming-meitner-fuji68]

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probar la web con distintos visitantes
        run: |
          echo "IP del runner: $(curl -s https://api.ipify.org)"
          probar() { printf '%-28s %-10s %s\n' "$1" "$2" "$(curl -s -o /dev/null -w '%{http_code}' $3 -A "$4" --max-time 20 "https://almenaraled.com$2")"; }
          CHROME="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          for ruta in / /llms.txt /robots.txt /es/; do
            probar "Chrome"            "$ruta" "-4" "$CHROME"
          done
          probar "Chrome IPv6"         "/" "-6" "$CHROME"
          probar "curl por defecto"    "/" "-4" "curl/8.5.0"
          probar "Lighthouse"          "/" "-4" "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36 Chrome-Lighthouse"
          probar "HeadlessChrome"      "/" "-4" "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) HeadlessChrome/130.0 Safari/537.36"
          probar "Googlebot"           "/" "-4" "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"
          probar "GPTBot"              "/" "-4" "Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko); compatible; GPTBot/1.1; +https://openai.com/gptbot"
          probar "ClaudeBot"           "/" "-4" "Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko; compatible; ClaudeBot/1.0; +claudebot@anthropic.com)"
          probar "PerplexityBot"       "/" "-4" "Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko; compatible; PerplexityBot/1.0; +https://perplexity.ai/perplexitybot)"
          echo "--- Cabeceras de la respuesta (Chrome) ---"
          curl -sI -4 -A "$CHROME" --max-time 20 https://almenaraled.com/ | head -20
          echo "--- Cuerpo de la respuesta (Chrome) ---"
          curl -s -4 -A "$CHROME" --max-time 20 https://almenaraled.com/ | head -c 600
