# ============================================================
# Almenara · Lighthouse audit
# ============================================================
# Performance, accessibility, best practices, SEO audits.
# Runs on push to main and weekly on a schedule.
# Skips gracefully if the site has not been built yet.
# ============================================================

name: Lighthouse

on:
  push:
    branches: [main]
    paths:
      - "**.html"
      - "assets/css/**"
      - "assets/js/**"
      - "assets/img/**"
      - ".github/workflows/lighthouse.yml"
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Lighthouse audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect built site
        id: detect
        run: |
          if [ -f "index.html" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No index.html present — skipping Lighthouse audit."
          fi

      - name: Setup Node.js
        if: steps.detect.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Lighthouse CI
        if: steps.detect.outputs.ready == 'true'
        run: npm install --no-save @lhci/cli@0.13

      - name: Run Lighthouse against local server
        if: steps.detect.outputs.ready == 'true'
        run: |
          cat > lighthouserc.json <<'EOF'
          {
            "ci": {
              "collect": {
                "staticDistDir": ".",
                "url": [
                  "http://localhost/index.html",
                  "http://localhost/technology.html",
                  "http://localhost/services.html",
                  "http://localhost/applications.html",
                  "http://localhost/contact.html"
                ],
                "numberOfRuns": 1,
                "settings": {
                  "preset": "desktop",
                  "throttlingMethod": "simulate"
                }
              },
              "assert": {
                "assertions": {
                  "categories:performance":   ["error", { "minScore": 0.95 }],
                  "categories:accessibility": ["error", { "minScore": 1.00 }],
                  "categories:best-practices":["error", { "minScore": 0.95 }],
                  "categories:seo":           ["error", { "minScore": 1.00 }],
                  "largest-contentful-paint": ["error", { "maxNumericValue": 1500 }],
                  "cumulative-layout-shift":  ["error", { "maxNumericValue": 0.1 }],
                  "total-blocking-time":      ["error", { "maxNumericValue": 200 }]
                }
              },
              "upload": {
                "target": "temporary-public-storage"
              }
            }
          }
          EOF
          npx lhci autorun --config=lighthouserc.json
        continue-on-error: false

      - name: Upload Lighthouse reports as artifact
        if: steps.detect.outputs.ready == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 30
