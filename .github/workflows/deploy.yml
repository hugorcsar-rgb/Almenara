name: Comprobaciones

# ESTE FLUJO YA NO PUBLICA NADA.
#
# La web se publica desde el propio Hostinger, conectado a este repositorio.
# Tener además un envío por FTP significaría dos sistemas escribiendo en la
# misma carpeta, y acaban pisándose. Se ha retirado esa parte.
#
# Lo que sí se conserva es la vigilancia, porque ha valido la pena: ha cazado
# dos veces un archivo subido a medias que, de haberse publicado, habría dejado
# una página rota en producción.
#
# Si alguna comprobación falla, este flujo se pone en rojo y avisa. No impide
# que Hostinger publique, así que ante un aspa roja conviene mirar antes de dar
# nada por bueno.
#
# Los secretos FTP_SERVER, FTP_USERNAME, FTP_PASSWORD y la variable FTP_DIR
# ya no se usan y pueden borrarse en Settings → Secrets and variables.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revisar:
    name: Revisar los archivos
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Comprobar que ningún HTML está cortado
        run: |
          for f in *.html legal/*.html; do
            [ -e "$f" ] || continue
            grep -q "</html>" "$f" || { echo "::error file=$f::El archivo está incompleto: falta </html>"; exit 1; }
          done
          echo "Todos los HTML se cierran correctamente."

      - name: Comprobar que existen los archivos que las páginas necesitan
        run: |
          test -f assets/js/app.js       || { echo "::error::Falta assets/js/app.js"; exit 1; }
          test -f assets/js/calc.js      || { echo "::error::Falta assets/js/calc.js"; exit 1; }
          test -f assets/css/site.css    || { echo "::error::Falta assets/css/site.css"; exit 1; }
          test -f assets/jost-var.woff2  || { echo "::error::Falta la tipografía assets/jost-var.woff2"; exit 1; }
          test -f contact.php            || { echo "::error::Falta contact.php: el formulario no recibiría"; exit 1; }
          for f in index.html technology.html services.html applications.html contact.html calculator.html 404.html legal/notice.html legal/privacy.html legal/cookies.html; do
            grep -q 'assets/js/app.js' "$f"    || { echo "::error file=$f::no enlaza app.js"; exit 1; }
            grep -q 'assets/css/site.css' "$f" || { echo "::error file=$f::no enlaza site.css"; exit 1; }
          done
          echo "Todas las páginas enlazan sus dependencias."

      - name: Comprobar que no queda el dominio antiguo
        run: |
          if grep -rl "hamergolfconsulting" --include="*.html" --include="*.js" --include="*.xml" --include="*.txt" . ; then
            echo "::error::Quedan referencias al dominio antiguo"; exit 1
          fi
          echo "Ninguna referencia al dominio antiguo."

      - name: Comprobar que los archivos llevan número de versión
        run: |
          # El .htaccess guarda css y js durante un año con la marca "immutable".
          # Sin un ?v=N en la dirección, quien ya visitó la web seguiría viendo
          # la versión antigua durante meses aunque se publique una nueva.
          for f in index.html technology.html services.html applications.html contact.html calculator.html 404.html legal/notice.html legal/privacy.html legal/cookies.html; do
            grep -q 'site\.css?v=' "$f"  || { echo "::error file=$f::site.css sin número de versión"; exit 1; }
            grep -q 'app\.js?v='    "$f" || { echo "::error file=$f::app.js sin número de versión"; exit 1; }
          done
          grep -q 'calc\.js?v=' calculator.html || { echo "::error::calc.js sin número de versión"; exit 1; }
          # Los iconos son el peor caso: el navegador los guarda en un almacén
          # aparte que ni la recarga forzada limpia.
          grep -q 'favicon\.svg?v=' index.html || { echo "::error::el favicon sin número de versión"; exit 1; }
          echo "Todos los archivos llevan versión."

      - name: Comprobar que no queda el correo antiguo
        run: |
          if grep -rl "hugorcsar@gmail" --include="*.html" --include="*.js" --include="*.php" . ; then
            echo "::error::Queda el correo antiguo en algún archivo"; exit 1
          fi
          grep -q "info@almenaraled.com" contact.php || { echo "::error::contact.php no apunta al correo bueno"; exit 1; }
          echo "Correo correcto en todas partes."

      - name: Comprobar que existe la imagen para compartir
        run: |
          test -f assets/img/og-image.jpg || { echo "::error::Falta assets/img/og-image.jpg: los enlaces se compartirían sin imagen"; exit 1; }
          echo "Imagen para compartir en su sitio."

      - name: Comprobar que existen las páginas traducidas
        run: |
          for l in es pt fr de it ru; do
            for f in index technology services applications calculator contact; do
              test -f "$l/$f.html" || { echo "::error::Falta $l/$f.html: ejecuta tools/build-i18n.mjs"; exit 1; }
            done
          done
          test -f llms.txt || { echo "::error::Falta llms.txt"; exit 1; }
          echo "Siete idiomas completos y llms.txt en su sitio."
      - name: Comprobar que ningún HTML está cortado
        run: |
          for f in *.html legal/*.html; do
            [ -e "$f" ] || continue
            grep -q "</html>" "$f" || { echo "::error file=$f::El archivo está incompleto: falta </html>"; exit 1; }
          done
          echo "Todos los HTML se cierran correctamente."

      - name: Comprobar que existen los archivos que las páginas necesitan
        run: |
          test -f assets/js/app.js       || { echo "::error::Falta assets/js/app.js"; exit 1; }
          test -f assets/js/calc.js      || { echo "::error::Falta assets/js/calc.js"; exit 1; }
          test -f assets/css/site.css    || { echo "::error::Falta assets/css/site.css"; exit 1; }
          test -f assets/jost-var.woff2  || { echo "::error::Falta la tipografía assets/jost-var.woff2"; exit 1; }
          test -f contact.php            || { echo "::error::Falta contact.php: el formulario no recibiría"; exit 1; }
          for f in index.html technology.html services.html applications.html contact.html calculator.html 404.html legal/notice.html legal/privacy.html legal/cookies.html; do
            grep -q 'assets/js/app.js' "$f"    || { echo "::error file=$f::no enlaza app.js"; exit 1; }
            grep -q 'assets/css/site.css' "$f" || { echo "::error file=$f::no enlaza site.css"; exit 1; }
          done
          echo "Todas las páginas enlazan sus dependencias."

      - name: Comprobar que no queda el dominio antiguo
        run: |
          if grep -rl "hamergolfconsulting" --include="*.html" --include="*.js" --include="*.xml" --include="*.txt" . ; then
            echo "::error::Quedan referencias al dominio antiguo"; exit 1
          fi
          echo "Ninguna referencia al dominio antiguo."

      - name: Comprobar que los archivos llevan número de versión
        run: |
          # El .htaccess guarda css y js durante un año con la marca "immutable".
          # Sin un ?v=N en la dirección, quien ya visitó la web seguiría viendo
