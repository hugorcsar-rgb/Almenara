name: Deploy

# Publica el sitio en Hostinger cada vez que se empuja a main.
#
# POR QUÉ NO SE USA LA ACCIÓN HABITUAL DE FTP
# SamKirkland/FTP-Deploy-Action sube cada archivo con un nombre temporal oculto
# (.in.loquesea) y después lo renombra. Hostinger rechaza ese renombrado y el
# despliegue muere con un error 550. Aquí se usa lftp, que escribe directamente
# sobre el nombre definitivo y no depende de esa maniobra.
#
# IMPORTANTE: no se usa --delete. El servidor tiene una carpeta "mensajes" con
# las copias del formulario de contacto que NO están en el repositorio; con
# --delete se borrarían en el primer despliegue.
#
# Requiere en Settings → Secrets and variables → Actions:
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD  (secretos)
#   FTP_DIR                                  (variable, p. ej. /public_html/)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar en Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Comprobar que el HTML no está roto
        run: |
          for f in *.html legal/*.html; do
            [ -e "$f" ] || continue
            grep -q "</html>" "$f" || { echo "::error file=$f::El archivo está incompleto: falta </html>"; exit 1; }
          done
          echo "Todos los HTML se cierran correctamente."

      - name: Comprobar que existen los archivos que las páginas necesitan
        run: |
          test -f assets/js/app.js    || { echo "::error::Falta assets/js/app.js"; exit 1; }
          test -f assets/js/calc.js   || { echo "::error::Falta assets/js/calc.js"; exit 1; }
          test -f assets/css/site.css || { echo "::error::Falta assets/css/site.css"; exit 1; }
          for f in index.html technology.html services.html applications.html contact.html calculator.html 404.html legal/notice.html legal/privacy.html legal/cookies.html; do
            grep -q 'assets/js/app.js' "$f"    || { echo "::error file=$f::no enlaza app.js"; exit 1; }
            grep -q 'assets/css/site.css' "$f" || { echo "::error file=$f::no enlaza site.css"; exit 1; }
          done
          echo "Todas las páginas enlazan sus dependencias."

      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Subir por FTPS
        env:
          SERVIDOR: ${{ secrets.FTP_SERVER }}
          USUARIO: ${{ secrets.FTP_USERNAME }}
          CLAVE: ${{ secrets.FTP_PASSWORD }}
          DESTINO: ${{ vars.FTP_DIR }}
        run: |
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate false;
            set net:max-retries 3;
            set net:timeout 20;
            set cmd:fail-exit true;
            open -u \"$USUARIO\",\"$CLAVE\" \"$SERVIDOR\";
            mirror --reverse --verbose --continue --parallel=3 --exclude-glob .git* --exclude-glob *.md --exclude-glob .editorconfig --exclude-glob .gitattributes --exclude-glob .gitignore --exclude .github/ --exclude node_modules/ --exclude mensajes/ ./ \"$DESTINO\";
          "
          echo "Publicado."
