          for f in index.html technology.html services.html applications.html contact.html calculator.html 404.html legal/notice.html legal/privacy.html legal/cookies.html; do
            grep -q 'site\.css?v=' "$f"  || { echo "::error file=$f::site.css sin número de versión"; exit 1; }
            grep -q 'app\.js?v='    "$f" || { echo "::error file=$f::app.js sin número de versión"; exit 1; }
          done
          grep -q 'calc\.js?v=' calculator.html || { echo "::error::calc.js sin número de versión"; exit 1; }
          echo "Todos los archivos llevan versión."

      - name: Comprobar que existe la imagen para compartir
        run: |
          test -f assets/img/og-image.jpg || { echo "::error::Falta assets/img/og-image.jpg: los enlaces se compartirían sin imagen"; exit 1; }
          echo "Imagen para compartir en su sitio."
      - name: Comprobar que ningún HTML está cortado
        run: |
          for f in *.html legal/*.html; do
            [ -e "$f" ] || continue
            grep -q "</html>" "$f" || { echo "::error file=$f::El archivo está incompleto: falta </html>"; exit 1; }
          done
          echo "Todos los HTML se cierran correctamente."

      - name: Comprobar que existen los archivos que las páginas necesitan
        run: |
          test -f assets/js/app.js       || { echo "::error::Falta assets/js/app.js"; exit 1; }
          test -f assets/js/calc.js      || { echo "::error::Falta assets/js/calc.js"; exit 1; }
          test -f assets/css/site.css    || { echo "::error::Falta assets/css/site.css"; exit 1; }
          test -f assets/jost-var.woff2  || { echo "::error::Falta la tipografía assets/jost-var.woff2"; exit 1; }
          test -f contact.php            || { echo "::error::Falta contact.php: el formulario no recibiría"; exit 1; }
          for f in index.html technology.html services.html applications.html contact.html calculator.html 404.html legal/notice.html legal/privacy.html legal/cookies.html; do
            grep -q 'assets/js/app.js' "$f"    || { echo "::error file=$f::no enlaza app.js"; exit 1; }
            grep -q 'assets/css/site.css' "$f" || { echo "::error file=$f::no enlaza site.css"; exit 1; }
          done
          echo "Todas las páginas enlazan sus dependencias."

      - name: Comprobar que no queda el dominio antiguo
        run: |
          if grep -rl "hamergolfconsulting" --include="*.html" --include="*.js" --include="*.xml" --include="*.txt" . ; then
